<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">

  <!-- Google Fonts (resolved when opened in a browser) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Marcellus&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap');
    </style>
  </defs>

  <!-- ── Warm off-white paper background ─────────────────────── -->
  <rect width="1200" height="630" fill="#FAFAF8"/>

  <!-- ── Inset frame (20 px margin, 1 px border) ─────────────── -->
  <rect x="20" y="20" width="1160" height="590"
        fill="none" stroke="rgba(10,10,10,0.09)" stroke-width="1"/>

  <!-- ── Editorial horizontal rules ─────────────────────────── -->
  <!-- Divide canvas into three editorial zones  -->
  <line x1="20" y1="190" x2="1180" y2="190"
        stroke="rgba(10,10,10,0.08)" stroke-width="1"/>
  <line x1="20" y1="458" x2="1180" y2="458"
        stroke="rgba(10,10,10,0.08)" stroke-width="1"/>


  <!-- ═══════════════════════════════════════════════════════════
       TOP ZONE  y 20–190
       ═══════════════════════════════════════════════════════════ -->

  <!-- Version badge pill — mirrors the landing-page hero badge -->
  <!-- Pill is centred at x=600; text uses text-anchor="middle" so it always fits -->
  <rect x="418" y="38" width="364" height="25" rx="12.5"
        fill="none" stroke="rgba(10,10,10,0.13)" stroke-width="1"/>
  <text x="600" y="55.5" text-anchor="middle"
        font-family="'Geist Mono','Courier New',monospace"
        font-size="11" letter-spacing="0.5">
    <tspan fill="#0A0A0A">•</tspan>
    <tspan fill="#6E6D67" dx="5"> CookLyt · 01</tspan>
    <tspan fill="#9B9A92">  ·  A product by Krilok</tspan>
  </text>

  <!-- Hero headline — line 1 -->
  <text x="600" y="110" text-anchor="middle"
        font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="30" font-weight="600" fill="#0A0A0A" letter-spacing="-0.5">
    The POS your restaurant
  </text>

  <!-- Hero headline — line 2 ("actually" in italic, matching landing page) -->
  <text x="600" y="150" text-anchor="middle"
        font-family="'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="30" font-weight="500" fill="#2A2A28" letter-spacing="-0.4">
    <tspan font-style="italic" fill="#56564F">actually</tspan> deserves.
  </text>


  <!-- ═══════════════════════════════════════════════════════════
       MIDDLE ZONE  y 190–458
       ═══════════════════════════════════════════════════════════ -->

  <!-- C arc logo mark
       Original viewBox: 200×200. Scale 0.54 → ~108×108 px on screen.
       Arc centre at local (100,100) → screen at (100×0.54, 100×0.54) = (54,54) within group.
       Target screen centre: (600, 305).
       translate = (600−54, 305−54) = (546, 251). -->
  <g transform="translate(546,251) scale(0.54)">
    <path d="M 154.194 25.409 A 92.2 92.2 0 1 0 154.194 174.591"
          fill="none" stroke="#0d0c0b" stroke-width="15.6" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="10.8" fill="#b06a3b"/>
  </g>

  <!-- COOKLY·T wordmark
       Original viewBox: 360×64. Scale 0.65 → display width 234 px, height 41.6 px.
       Arc bottom in screen coords: 251 + 174.591×0.54 ≈ 345. Gap 20 px → wordmark top at 365.
       Horizontal centre: 600 − (360×0.65)/2 = 600 − 117 = 483. -->
  <g transform="translate(483,365) scale(0.65)">
    <text x="0" y="49"
          font-family="'Marcellus',Georgia,'Times New Roman',serif"
          font-size="56" fill="#0d0c0b" letter-spacing="10.08">COOKLY</text>
    <circle cx="294.2" cy="29.43" r="5.03" fill="#b06a3b"/>
    <text x="309.33" y="49"
          font-family="'Marcellus',Georgia,'Times New Roman',serif"
          font-size="56" fill="#0d0c0b" letter-spacing="10.08">T</text>
  </g>


  <!-- ═══════════════════════════════════════════════════════════
       BOTTOM ZONE  y 458–610
       ═══════════════════════════════════════════════════════════ -->

  <!-- Domain — Geist Mono, wide letter-spacing, muted -->
  <text x="600" y="520" text-anchor="middle"
        font-family="'Geist Mono','Courier New',monospace"
        font-size="14" fill="#9B9A92" letter-spacing="3">cooklyt.in</text>

  <!-- Attribution — very soft -->
  <text x="600" y="549" text-anchor="middle"
        font-family="'Geist',-apple-system,sans-serif"
        font-size="11.5" fill="#C4C2B8">by Krilok</text>

</svg>
